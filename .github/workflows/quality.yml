name: Quality Gate

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: futbol_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d futbol_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/futbol_ci?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/futbol_ci?schema=public
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/futbol_ci
      TEST_DIRECT_URL: postgresql://postgres:postgres@localhost:5432/futbol_ci
      AUTH_SECRET: ci-only-auth-secret-32-characters-minimum
      SETUP_SECRET: ci-only-setup-secret
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      INTEGRATION_USE_EXISTING_SCHEMA: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Architecture and domain tests
        run: npm run modernization

      - name: Integration tests
        run: npm run test:integration

      - name: TypeScript
        run: npm run typecheck

      - name: Production build
        run: npm run build
